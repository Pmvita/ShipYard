name: ShipYard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: shipyard

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-push:
    name: Build & push image
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Require AWS_ROLE_ARN
        id: gate
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "AWS_ROLE_ARN secret not set — skipping ECR push and Terraform apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.gate.outputs.skip == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.gate.outputs.skip == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  terraform:
    name: Terraform plan/apply
    needs: [lint-test, build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Require AWS_ROLE_ARN
        id: gate
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "AWS_ROLE_ARN secret not set — skipping Terraform."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.gate.outputs.skip == 'false'
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        if: steps.gate.outputs.skip == 'false'
        run: terraform init -input=false

      - name: Terraform plan
        if: steps.gate.outputs.skip == 'false'
        run: |
          terraform plan -input=false -out=tfplan \
            -var="image_tag=${{ needs.build-push.outputs.image_tag }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}"

      - name: Terraform apply
        if: steps.gate.outputs.skip == 'false'
        run: terraform apply -input=false -auto-approve tfplan

  # PRs never apply. Plan is optional when secrets exist; otherwise lint-test is enough.
  terraform-plan-pr:
    name: Terraform plan (PR)
    needs: lint-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Skip without AWS role
        id: gate
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "No AWS_ROLE_ARN — PR plan skipped (lint/test already ran)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.gate.outputs.skip == 'false'
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        if: steps.gate.outputs.skip == 'false'
        run: terraform init -input=false

      - name: Terraform plan
        if: steps.gate.outputs.skip == 'false'
        run: |
          terraform plan -input=false \
            -var="image_tag=pr-${{ github.event.pull_request.number }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}"
